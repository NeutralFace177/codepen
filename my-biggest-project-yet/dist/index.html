  <body>
    <h1 style="">Math Parser Project</h1>
    <input type="text" id="input" placeholder="Enter a math expression"></input> <a id="solve">Solution:</a>
  <div>
    <br>
  <label class="switch"> 
    <input id="cleanSolution" type="checkbox">
    <span class="slider round"></span>
    </label> Raw Answers </div>
  <label id="lablel">Floating Point Err: <input type="number" id="roundingPoint"></input> (Currently Disabled)</ label>
  <div id="desc"><p>Implied multiplication (without a *) only works before constants. So between parentheses or functions need a *. Use parentheses to specify the input for functions<br><p class="brk"></p>Answers that are really small may show up as 0 if raw answers is off. Floating Point Err specifies 
the rounding threshold. Floating Point Err = 9 means that numbers smaller than 10^-9 will be rounded down, and numbers will be rounded after 9 repeating digits (0s and 9s).
    <br><b>NOTE: code that is NOT MINE has comments specifying so. code from elsewhere is only used to made things look nicer / work nicer, and doesn't directly have to do with the main idea of this project, a math parser.</br></b>
<div id="knownBugs"> Known Bugs: <br>1. Repeated subtraction w/o parentheses is broken (do 1-(pi+e) instead of 1-pi-e)<p class="brk"></p>
    1.5. Repeated division has a simillar bug. Instead of following normal order of operations and calculating the left most operation then continuing with that value to the next operation. The parser groups the upcoming operations. E.g. 2/3/4 is calculated as 2/(3/4) instead of (2/3)/4 (technically this is the same issue as the repeated subtraction issue, it only applies to subtraction and division as there is no communative property of div/sub).
 <p class="brk"></p> 2. An open parenthesis that isn't followed by a closing one, while still having equal numbers of both open and closed parentheses will cause a crash<p>
  
  </div></div>
